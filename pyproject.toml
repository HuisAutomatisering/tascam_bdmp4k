[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "S",      # flake8-bandit
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.tascam_bdmp4k"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
